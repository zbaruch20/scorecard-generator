version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - production
    ports:
      - "8080:80"
    restart: unless-stopped
    container_name: scorecard-generator-web

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    profiles:
      - development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    container_name: scorecard-generator-dev
    stdin_open: true
    tty: true
